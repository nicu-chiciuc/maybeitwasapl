# Deploys the app with the Alchemy stack in alchemy.run.ts, through the shared workflow of
# samebase/samebase. A push to main deploys the stage `prod`. A pull request from this repository
# deploys the stage `pr-<number>`, a Worker of its own, and keeps one comment with its stacks;
# closing the pull request destroys that stage. The state of every stage is in the
# `alchemy-state-store` project of the Convex team. This workflow never destroys `prod`.
name: Alchemy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # Run on main with plan to see what a deploy would do, and run once with adopt to take over a
  # Worker that exists but is not in the state of the stage `prod`.
  workflow_dispatch:
    inputs:
      adopt:
        description: Adopt resources that exist but are not in state yet
        type: boolean
        default: false
      plan:
        description: Show the plan and change nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  alchemy:
    uses: samebase/samebase/.github/workflows/alchemy-deploy.yml@bbdd3934972b842de8280206efcaa49288bf8413
    permissions:
      contents: read
      pull-requests: write
    with:
      adopt: ${{ inputs.adopt == true }}
      detect-drift: true
      plan: ${{ inputs.plan == true }}
    secrets:
      ALCHEMY_ENV: |
        CONVEX_ACCESS_TOKEN=${{ secrets.CONVEX_ACCESS_TOKEN }}
        CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
