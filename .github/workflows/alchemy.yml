name: Alchemy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      adopt:
        description: Adopt resources that exist but are not in state yet
        type: boolean
        default: false
      plan:
        description: Show the plan and change nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  alchemy:
    uses: samebase/samebase/.github/workflows/alchemy-deploy.yml@01d2bd218777c0a049310b61c7f19260a12b616d
    permissions:
      contents: read
      pull-requests: write
    with:
      adopt: ${{ inputs.adopt == true }}
      detect-drift: true
      plan: ${{ inputs.plan == true }}
    secrets:
      ALCHEMY_ENV: |
        CONVEX_ACCESS_TOKEN=${{ secrets.CONVEX_ACCESS_TOKEN }}
        CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
